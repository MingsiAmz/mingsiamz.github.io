name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          submodules: true  # 拉取主题等子模块，避免找不到 Butterfly 主题
          fetch-depth: 0    # 获取完整历史，避免版本号获取错误

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22   # 使用 Node 22，避开 Node 20 废弃警告

      - name: 安装依赖
        run: npm install

      - name: 编译生成静态网页
        run: |
          npx hexo clean     # 清理缓存，防止旧文件干扰
          npx hexo generate  # 生成 public 目录

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传编译产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
		  include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5