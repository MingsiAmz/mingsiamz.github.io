name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          npm install
          npm install hexo-cli@~4.3.0 --save-dev

      - name: 编译生成静态网页
        run: |
          rm -rf db.json public .deploy_git
          npm run clean
          npm run build -- --debug
          if [ ! -d "public" ]; then
            echo "::error::public 目录未生成！Hexo 构建失败。"
            exit 1
          fi
          echo "构建成功，public 目录文件列表："
          ls -la public/

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传编译产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4